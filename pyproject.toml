[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioimage-portfolio"
version = "0.1.0"
description = "Reusable utilities for a public applied-AI bioimage analysis portfolio"
requires-python = ">=3.10"
authors = [{name = "Manh Tin Ho"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
